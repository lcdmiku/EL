<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>游戏登录前界面</title>
    <style>
        /* 整体页面样式 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('{{ url_for('static',filename='images/index_pic.png') }}'); /* 修正后的背景图片路径设置 */
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 表单样式 */
        form {
            background-color: rgba(255, 255, 255, 0.8); /* 半透明白色背景 */
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        /* 按钮样式 */
        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button[name="choice"][value="login"] {
            background-color: #007BFF;
            color: white;
        }

        button[name="choice"][value="register"] {
            background-color: #28A745;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <form action="" method="post">
        <button type="submit" name="choice" value="login">登录</button>
        <br>
        <button type="submit" name="choice" value="register">注册</button>
    </form>
</body>

</html>
