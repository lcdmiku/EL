<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>register</title>
    <style>
        /* 整体页面样式 */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 表单样式 */
        form {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        /* 表单标签样式 */
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        /* 表单输入框样式 */
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }

        /* 提交按钮样式 */
        input[type="submit"] {
            background-color: #007BFF;
            color: white;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }

        /* 错误信息样式 */
        p {
            color: red;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    {% if message %}
    <p>{{ message }}</p>
    {% endif %}
    <form action="" method="post">
         {{ form.csrf_token }}
        {{ form.username.label }}
        <br>
        {{ form.username }}
        <br>
        {{ form.password.label }}
        <br>
        {{ form.password }}
        <br>
        {{ form.password2.label }}
        <br>
        {{ form.password2 }}
        <br>
        {{ form.submit }}
    </form>
</body>

</html>
